<!DOCTYPE html>
<html>
<body>

<h2>Hyperlink Example</h2>

<!-- Basic Link -->
<a href="https://www.example.com">Visit Example</a><br><br>

<!-- Link opening in same tab -->
<a href="https://www.google.com" target="_self">Open Google (Same Tab)</a><br><br>

<!-- Link opening in new tab -->
<a href="https://www.google.com" target="_blank">Open Google (New Tab)</a>

</body>
</html>
